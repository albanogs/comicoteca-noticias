name: Actualizar noticias

on:
  schedule:
    - cron: "17 */3 * * *"   # cada 3 horas
  workflow_dispatch:          # botón "Run workflow" para probar a mano

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Leer el feed
        run: python update.py
      - name: Guardar cambios
        run: |
          if [ -n "$(git status --porcelain noticias.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add noticias.json
            git commit -m "Noticias actualizadas"
            git push
          else
            echo "Sin cambios que guardar."
          fi
